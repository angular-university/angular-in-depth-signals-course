<div class="page-container">

  <header class="index-intro">
    <h2 class="index-title">Course demos</h2>
    <p class="index-lead">
      One page per section, and every section stands on its own. Pick a section, then pick a
      demo inside it.
    </p>
  </header>

  <ol class="contents">
    @for (section of sections; track section.slug) {

      <li>
        <a class="contents-row" [routerLink]="['/', section.slug]">
          <span class="contents-number">{{ section.number }}</span>
          <span class="contents-body">
            <span class="contents-title">{{ section.title }}</span>
            <span class="contents-summary">{{ section.summary }}</span>
          </span>
        </a>
      </li>

    } @empty {
      <li class="contents-empty">No section demos yet.</li>
    }
  </ol>

</div>
