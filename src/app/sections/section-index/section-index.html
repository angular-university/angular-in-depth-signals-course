<div class="page-container">

  <div class="index-header">
    <div class="section-icon">
      <span class="material-icons">menu_book</span>
    </div>
    <div>
      <h2 class="index-title">Course Demos</h2>
      <p class="index-subtitle">
        One page per section. Each page holds the demos for that section's lessons.
      </p>
    </div>
  </div>

  <div class="index-grid">
    @for (section of sections; track section.slug) {

      <a class="index-card" [routerLink]="['/', section.slug]">
        <span class="index-card-number">Section {{ section.number }}</span>
        <span class="index-card-title">{{ section.title }}</span>
        <span class="index-card-summary">{{ section.summary }}</span>
      </a>

    } @empty {
      <p class="index-empty">No section demos yet.</p>
    }
  </div>

</div>
