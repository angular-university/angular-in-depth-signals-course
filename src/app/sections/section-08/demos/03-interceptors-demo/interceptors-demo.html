<div class="panel">
  <small>Authorization</small>
  <p>{{ received() }}</p>
</div>

<div class="actions">
  <button (click)="request()">Request</button>
  <button (click)="request(true)">Request with SKIP_AUTH</button>
  <button (click)="logIn()">Log in</button>
  <button (click)="logOut()">Log out</button>
</div>
