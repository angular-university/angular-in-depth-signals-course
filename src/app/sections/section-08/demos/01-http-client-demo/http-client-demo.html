<div class="panel">
  @if (error()) {
    <p>{{ error() }}</p>
  } @else {
    <p>{{ course()?.title }}</p>
  }
</div>

<div class="actions">
  <input #idInput type="number" value="1" />
  <button (click)="loadCourse(idInput.valueAsNumber)">Load</button>
</div>

<div class="actions">
  <input #titleInput value="New title" />
  <button (click)="saveCourse(idInput.valueAsNumber, titleInput.value)">Save</button>
</div>
