<div class="stack">
  <div class="panel">
    <h4>observe: 'body'</h4>
    <p>{{ body()?.title }}</p>
    <div class="actions">
      <button (click)="loadBody()">Send</button>
    </div>
  </div>

  <div class="panel">
    <h4>observe: 'response'</h4>
    <p>{{ response()?.status }} {{ response()?.headers?.get('content-type') }}</p>
    <div class="actions">
      <button (click)="loadResponse()">Send</button>
    </div>
  </div>

  <div class="panel">
    <h4>observe: 'events'</h4>
    <div class="list">
      @for (event of events(); track $index) {
        <div>{{ event }}</div>
      }
    </div>
    <div class="actions">
      <button (click)="loadEvents()">Send</button>
    </div>
  </div>
</div>
