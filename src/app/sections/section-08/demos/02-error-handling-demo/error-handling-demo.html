<div class="split">
  <div class="panel plain">
    <small>title</small>
    <p>{{ title() }}</p>
  </div>
  <div class="panel">
    <small>error</small>
    <p>{{ error() }}</p>
  </div>
</div>

<div class="actions">
  <input #idInput type="number" value="99" />
  <button (click)="load(idInput.valueAsNumber)">Load</button>
</div>
