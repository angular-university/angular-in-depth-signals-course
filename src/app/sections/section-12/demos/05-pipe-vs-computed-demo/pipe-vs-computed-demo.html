<div class="split">
  <div class="panel plain">
    <small>currency pipe</small>
    <p>{{ amount() | currency }}</p>
  </div>
  <div class="panel">
    <small>computed() with formatCurrency()</small>
    <p>{{ formatted() }}</p>
  </div>
</div>

<div class="actions">
  <input #amountInput type="number" [value]="amount()" (input)="setAmount(amountInput.valueAsNumber)" />
</div>
