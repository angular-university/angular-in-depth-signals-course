<div class="stack">
  <div class="panel">
    <h4>Request object</h4>
    <small>matches</small>
    <p class="counter">{{ results.value()?.length }}</p>
    <div class="actions">
      <input #queryInput [value]="query()" />
      <button (click)="search(queryInput.value)">Search</button>
    </div>
  </div>

  <div class="panel">
    <h4>parse</h4>
    <small>total</small>
    <p class="counter">{{ total.value() }}</p>
    <div class="actions">
      <button (click)="reload()">Reload</button>
    </div>
  </div>
</div>
