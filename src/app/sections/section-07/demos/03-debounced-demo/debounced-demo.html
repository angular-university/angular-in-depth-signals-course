<div class="split">
  <div class="panel plain">
    <small>query</small>
    <p>{{ query() }}</p>
  </div>
  <div class="panel plain">
    <small>{{ debouncedQuery.status() }}</small>
    <p>{{ debouncedQuery.value() }}</p>
  </div>
  <div class="panel">
    <small>{{ courses.status() }}</small>
    @if (courses.isLoading()) {
      <p>Loading...</p>
    } @else if (courses.hasValue()) {
      @for (course of courses.value(); track course.id) {
        <p>{{ course.title }}</p>
      }
    }
  </div>
</div>

<div class="actions">
  <input #queryInput (input)="setQuery(queryInput.value)" />
</div>
