<div class="stack">
  <div class="panel">
    <h4>viewChild()</h4>
    <input #box value="Focus me" />
    <div class="actions">
      <button (click)="focus()">Focus</button>
    </div>
  </div>

  <div class="panel">
    <h4>viewChildren()</h4>
    <p class="counter">{{ children().length }}</p>
    @for (id of ids(); track id) {
      <small #child>Child {{ id }}</small>
    }
    <div class="actions">
      <button (click)="add()">Add</button>
      <button (click)="remove()">Remove</button>
    </div>
  </div>

  <div class="panel">
    <h4>read</h4>
    <hello #hello />
    <p>{{ result() }}</p>
    <div class="actions">
      <button (click)="readComponent()">Read component</button>
      <button (click)="readElement()">Read ElementRef</button>
    </div>
  </div>
</div>
