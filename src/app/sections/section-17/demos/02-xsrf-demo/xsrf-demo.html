<div class="split">
  <div class="panel">
    <small>HttpClient</small>
    <p>{{ httpClientStatus() }}</p>
  </div>
  <div class="panel plain">
    <small>fetch()</small>
    <p>{{ fetchStatus() }}</p>
  </div>
</div>

<div class="actions">
  <button (click)="sendWithHttpClient()">HttpClient POST</button>
  <button (click)="sendWithFetch()">fetch() POST</button>
</div>
