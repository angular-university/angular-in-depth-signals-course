<div class="panel">
  <canvas #canvas width="200" height="200"></canvas>
  <small>runs <span #runs>0</span></small>
</div>

<div class="actions">
  <input #slider type="range" min="10" max="90" [value]="size()" (input)="setSize(slider.value)" />
  <button (click)="drawCircle(size())">Draw circle</button>
</div>
