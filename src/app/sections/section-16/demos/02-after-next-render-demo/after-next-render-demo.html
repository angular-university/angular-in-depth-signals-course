<div class="stack">
  <div class="panel">
    <h4>Focus</h4>
    <input #field />
  </div>

  <div class="panel">
    <h4>Scroll into view</h4>
    <div class="panel plain scroll">
      @for (line of lines(); track line) {
        <p #line>{{ line }}</p>
      }
    </div>
    <div class="actions">
      <button (click)="addLine()">Add line</button>
    </div>
  </div>
</div>
