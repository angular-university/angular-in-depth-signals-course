<div class="split">
  <div class="panel plain">
    <small>plural</small>
    <p i18n="items|Number of items@@itemCount">
      {count(), plural, =0 {No items} =1 {One item} other {{{ count() }} items}}
    </p>
  </div>
  <div class="panel">
    <small>select</small>
    <p i18n="Name of the current role@@roleName">
      {role(), select, fullAccess {Administrator} other {Viewer}}
    </p>
  </div>
  <div class="panel plain">
    <small>$localize</small>
    <p></p>
  </div>
</div>

<div class="actions">
  <button i18n="@@addButton" (click)="increment()">Add</button>
  <button i18n="@@removeButton" (click)="decrement()">Remove</button>
  <select #roleSelect (change)="setRole(roleSelect.value)">
    <option value="fullAccess" i18n="@@adminRole">Admin</option>
    <option value="readOnly" i18n="@@viewerRole">Viewer</option>
  </select>
</div>
