<div class="split">
  <div class="panel plain">
    <small>i18nPlural</small>
    <p>{{ count() | i18nPlural: countMapping }}</p>
  </div>
  <div class="panel">
    <small>i18nSelect</small>
    <p>{{ role() | i18nSelect: roleMapping }}</p>
  </div>
</div>

<div class="actions">
  <button (click)="increment()">Add</button>
  <button (click)="decrement()">Remove</button>
  <select #roleSelect (change)="setRole(roleSelect.value)">
    <option value="fullAccess">Admin</option>
    <option value="readOnly">Viewer</option>
  </select>
</div>
