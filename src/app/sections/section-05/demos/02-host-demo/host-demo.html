<div class="stack">
  <div class="panel">
    <h4>:host</h4>
    <padded-box />
  </div>

  <div class="panel">
    <h4>:host(.active)</h4>
    <host-box [class.active]="active()" />
    <div class="actions">
      <button (click)="toggleActive()">Toggle</button>
    </div>
  </div>

  <div class="panel" [class.light]="light()">
    <h4>:host-context(.light)</h4>
    <themed-text />
    <div class="actions">
      <button (click)="toggleLight()">Toggle theme</button>
    </div>
  </div>

  <div class="panel deep">
    <h4>::ng-deep</h4>
    <inner-text />
  </div>
</div>
