<div class="panel">
  @if (mode() === 'None') {
    <none-mode />
  } @else {
    <emulated-mode />
  }
  <p class="label">Outside the component</p>
</div>

<div class="actions">
  <select #modeSelect (change)="mode.set(modeSelect.value)">
    <option>Emulated</option>
    <option>None</option>
  </select>
</div>
