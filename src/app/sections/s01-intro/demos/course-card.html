<article class="card">

  <div class="card-image">
    <img [src]="course.iconUrl" [alt]="course.title" />
  </div>

  <div class="card-body">
    <span class="card-category">{{ course.category }}</span>
    <h4 class="card-title">{{ course.title }}</h4>
    <p class="card-description">{{ course.description }}</p>
  </div>

</article>
