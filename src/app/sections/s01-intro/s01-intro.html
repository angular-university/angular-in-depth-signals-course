<div class="page-container">

  <div class="section-header">
    <div class="section-icon">
      <span class="material-icons">play_circle</span>
    </div>
    <h2 class="section-title">Section 1 — Introduction to Angular, with Signals From the Beginning</h2>
  </div>

  <demo-picker [demos]="demos" [(selected)]="selected" />

  @switch (selected()) {

    @case ('first-component') {
      <demo-block title="Our first component" lessons="1.1-1.2">
        <first-component-demo />
      </demo-block>
    }

    @case ('first-signal') {
      <demo-block title="Our first signal — set() and update()" lessons="1.3">
        <first-signal-demo />
      </demo-block>
    }

    @case ('not-a-signal') {
      <demo-block title="What happens when data is not in a signal" lessons="1.4">
        <not-a-signal-demo />
      </demo-block>
    }

  }

</div>
