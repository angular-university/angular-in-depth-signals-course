<div class="split">
  <div class="panel plain">
    <small>contentChild()</small>
    <p>{{ first()?.label() }}</p>
  </div>
  <div class="panel">
    <small>contentChildren()</small>
    <p class="counter featured">{{ items().length }}</p>
  </div>
  <div class="panel">
    <small>descendants: true</small>
    <p class="counter featured">{{ allItems().length }}</p>
  </div>
  <div class="panel plain">
    <small>projected</small>
    <ng-content />
  </div>
</div>
