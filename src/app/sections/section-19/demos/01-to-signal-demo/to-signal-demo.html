<div class="stack">
  <div class="panel">
    <h4>toSignal()</h4>
    <p class="counter">{{ seconds() }}</p>
  </div>

  <div class="panel">
    <h4>toObservable()</h4>
    <p class="counter featured">{{ count$ | async }}</p>
    <div class="actions">
      <button (click)="increment()">Increment</button>
    </div>
  </div>
</div>
