<div class="stack">
  <div class="split">
    <div class="panel plain">
      <small>sent</small>
      <p class="counter">{{ sent() }}</p>
    </div>
    <div class="panel plain">
      <small>received</small>
      <p class="counter">{{ received() }}</p>
    </div>
  </div>

  <div class="panel">
    <small>courses</small>
    @for (course of courses(); track course.id) {
      <p>{{ course.title }}</p>
    }
  </div>
</div>

<div class="actions">
  <input #queryInput (input)="setQuery(queryInput.value)" />
</div>
