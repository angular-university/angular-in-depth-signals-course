<p class="demo-label" [attr.role]="soldOut() ? 'alert' : null">
  {{ soldOut() ? 'This course is sold out' : 'Seats available' }}
</p>

<div class="demo-actions">
  <button class="btn btn-primary" [disabled]="soldOut()">Enrol now</button>
  <button class="btn btn-ghost" (click)="soldOut.set(!soldOut())">Toggle sold out</button>
</div>
