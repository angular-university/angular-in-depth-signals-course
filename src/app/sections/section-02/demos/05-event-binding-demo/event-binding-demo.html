<div
  class="demo-panel demo-panel-live"
  (window:resize)="show('window:resize')"
  (document:click)="show('document:click at x = ' + $event.clientX)"
>
  <input
    class="form-control"
    placeholder="Press Enter, Shift + Enter or W"
    (keyup.enter)="show('keyup.enter')"
    (keyup.shift.enter)="show('keyup.shift.enter')"
    (keydown.code.keyw)="show('keydown.code.keyw')"
  />
  <p class="demo-label">Last event</p>
  <p class="demo-value">{{ lastEvent() }}</p>
</div>
