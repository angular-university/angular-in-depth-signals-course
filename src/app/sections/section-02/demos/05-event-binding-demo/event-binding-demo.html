<div (window:resize)="onResize()" (document:click)="onPageClick()">
  <div class="demo-actions">
    <input
      class="form-control"
      placeholder="Press some keys"
      (keyup)="key.set($event.key)"
      (keyup.enter)="shortcut.set('Enter')"
      (keyup.shift.enter)="shortcut.set('Shift + Enter')"
      (keydown.code.keyw)="shortcut.set('W key position')"
    />
  </div>

  <div class="demo-rows">
    <span class="demo-label">Key</span>
    <span>{{ key() }}</span>

    <span class="demo-label">Shortcut</span>
    <span>{{ shortcut() }}</span>

    <span class="demo-label">Window width</span>
    <span>{{ width() }}px</span>

    <span class="demo-label">Page clicks</span>
    <span>{{ clicks() }}</span>
  </div>
</div>
