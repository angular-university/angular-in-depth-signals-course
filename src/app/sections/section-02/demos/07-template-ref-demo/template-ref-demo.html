<p class="demo-label"><code>&lt;input #title /&gt;</code></p>
<input #title class="form-control" placeholder="Type a course title" />

<div class="demo-actions">
  <button class="btn btn-ghost" (click)="title.focus()">Focus the input</button>
  <button class="btn btn-primary" (click)="saved.set(title.value)">Save</button>
</div>

<div class="demo-split">
  <div class="demo-panel demo-panel-live">
    <p class="demo-label"><code>saved()</code></p>
    <p>{{ saved() }}</p>
  </div>
  <div class="demo-panel">
    <p class="demo-label"><code>title.value</code></p>
    <p>{{ title.value }}</p>
  </div>
</div>
