<p class="demo-label">Course progress</p>
<p class="demo-counter">{{ progress() }}%</p>

<div class="progress">
  <div
    class="progress-bar"
    [style.width.%]="progress()"
    [style.background]="progress() === 100 ? 'var(--color-success)' : null"
  ></div>
</div>

<div class="demo-actions">
  <button class="btn btn-ghost" (click)="change(-10)">−10%</button>
  <button class="btn btn-primary" (click)="change(10)">+10%</button>
</div>

<p class="demo-note">
  <code>[style.width.%]</code> appends the unit for you. Binding <code>null</code> removes the
  inline style, so the bar keeps its stylesheet gradient until it reaches 100%.
</p>
