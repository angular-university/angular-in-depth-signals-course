<div class="stack">
  <div class="panel">
    <h4>plain if</h4>
    @if (showLogo()) {
      <img src="angular-logo.svg" alt="Angular logo" width="84" height="89" />
    }
    <div class="actions">
      <button (click)="toggleLogo()">Toggle</button>
    </div>
  </div>

  <div class="panel">
    <h4>if, else if and else</h4>
    <p>Count: {{ count() }}</p>
    @if (count() === 0) {
      <p class="counter featured">Zero</p>
    } @else if (count() < 5) {
      <p class="counter featured">Less than 5</p>
    } @else {
      <p class="counter featured">5 or more</p>
    }
    <div class="actions">
      <button (click)="increment()">Increment</button>
      <button (click)="reset()">Reset</button>
    </div>
  </div>
</div>
