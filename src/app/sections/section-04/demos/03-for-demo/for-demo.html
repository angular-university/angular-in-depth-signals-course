<div class="panel">
  <div class="list">
    @for (item of items(); track item.id) {
      <div [class.even]="$even" [class.odd]="$odd" [class.first]="$first" [class.last]="$last">
        {{ $index }}: {{ item.label }}
      </div>
    } @empty {
      <div>No items</div>
    }
  </div>
</div>
<div class="actions">
  <button (click)="add()">Add</button>
  <button (click)="remove()">Remove</button>
</div>
