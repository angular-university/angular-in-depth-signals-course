<div class="split">
  <div class="panel plain">
    <small>count</small>
    <p class="counter">{{ count() }}</p>
  </div>
  <div class="panel">
    <small>value</small>
    <p class="counter featured">{{ value() }}</p>
  </div>
</div>

<div class="actions">
  <button (click)="increment()">Increment</button>
  <button (click)="toggle()">Toggle</button>
</div>
