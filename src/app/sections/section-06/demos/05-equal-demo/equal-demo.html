<div class="split">
  <div class="panel plain">
    <h4>Default equality</h4>
    <p>{{ plain().join(', ') }}</p>
    <div class="actions">
      <button (click)="setPlainSame()">Set same items</button>
    </div>
  </div>

  <div class="panel">
    <h4>Deep equality</h4>
    <p>{{ custom().join(', ') }}</p>
    <div class="actions">
      <button (click)="setCustomSame()">Set same items</button>
    </div>
  </div>
</div>
