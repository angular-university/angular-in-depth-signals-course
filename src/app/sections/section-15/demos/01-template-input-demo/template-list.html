<ng-template #defaultItem let-item="item" let-index="index">
  <p>{{ index }}. {{ item }}</p>
</ng-template>

@for (item of items(); track item; let index = $index) {
  <ng-container
    [ngTemplateOutlet]="itemTemplate() ?? defaultItem"
    [ngTemplateOutletContext]="{ item: item, index: index }"
  />
}
